global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: routefast-api-gateway
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
  - job_name: routefast-order-service
    static_configs:
      - targets: ['host.docker.internal:3001']
  - job_name: routefast-driver-service
    static_configs:
      - targets: ['host.docker.internal:3002']
  - job_name: routefast-dispatch-service
    static_configs:
      - targets: ['host.docker.internal:3003']
  - job_name: routefast-tracking-service
    static_configs:
      - targets: ['host.docker.internal:3004']

  - job_name: routefast-rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
