apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-service
  namespace: routefast
  labels:
    app.kubernetes.io/name: dispatch-service
    app.kubernetes.io/part-of: routefast
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch-service
        app.kubernetes.io/part-of: routefast
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: dispatch-service
          image: ghcr.io/joeldiaz93/routefast-dispatch-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: routefast-config
            - secretRef:
                name: routefast-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: dispatch-service
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-service
  namespace: routefast
spec:
  selector:
    app.kubernetes.io/name: dispatch-service
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dispatch-service
  namespace: routefast
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dispatch-service
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
